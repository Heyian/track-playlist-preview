name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:local
      - name: Check the built folder against the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bun run check:dist --tag "$TAG"
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./src/metadata.json').version")" >> "$GITHUB_OUTPUT"
      # publish@v1 merges our entry into a depth-1 clone of the token owner's spicetify/modules
      # fork. A stale fork would drop versions published since, so sync it first.
      - name: Sync the spicetify/modules fork
        env:
          GH_TOKEN: ${{ secrets.SPICETIFY_SUBMIT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No SPICETIFY_SUBMIT_TOKEN: publish runs print-only."
            exit 0
          fi
          gh repo fork spicetify/modules --clone=false --remote=false || true
          gh repo sync "$(gh api user --jq .login)/modules" --source spicetify/modules --branch main
      - uses: spicetify/actions/publish@v1
        id: publish
        with:
          dist: dist/track-playlist-preview@${{ steps.version.outputs.version }}
          release-tag: ${{ needs.release-please.outputs.tag_name }}
          token: ${{ secrets.SPICETIFY_SUBMIT_TOKEN }}
      # publish@v1 declares an `entry` output but never sets it; the entry is only written to
      # submission-entry.json in the workspace.
      - name: Write the store entry to the summary
        run: |
          {
            echo '### Store entry'
            echo
            echo 'Add as `vault/track-playlist-preview.json` in a spicetify/modules PR:'
            echo
            echo '```json'
            cat submission-entry.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
